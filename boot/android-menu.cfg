# The laptop's menu for Googlebook OS. deploy.py fills in the placeholders: the kernel command line
# (android/cmdline.txt on one line) when it makes the bundle, and the kernel and initrd content
# hashes when it installs the files. The arguments after the command line are only for the laptop;
# QEMU's direct-kernel boot does not use this menu.
#   panic=0                       stay on screen after a kernel panic; Google's kernel reboots at once
#   earlycon=efifb                log on the firmware's framebuffer until a GPU driver takes over
#   printk.devkmsg=on             keep init's messages in the log, unthrottled
#   console=drm_log               enable the screen log despite Google's built-in console=ttynull
#   initcall_blacklist=nvme_init  never probe the internal NVMe: it holds another system
set timeout=3
set default=0

# Only this laptop's Barcelo GPU selects the AMD stack; QEMU keeps softpipe.
set dali_graphics=softpipe
setpci -d 1002:15e7 -v dali_gpu VENDOR_ID
if [ "$dali_gpu" = "1002" ]; then
    set dali_graphics=amd
fi

menuentry "Googlebook OS" {
    linux ($root)/dali/kernel-@KERNEL@ @CMDLINE@ panic=0 earlycon=efifb printk.devkmsg=on console=drm_log initcall_blacklist=nvme_init androidboot.dali.graphics=$dali_graphics
    initrd ($root)/dali/initramfs-@INITRAMFS@
}
if [ -f ($root)/dali/grub.previous.cfg ]; then
    menuentry "Previous build" {
        configfile ($root)/dali/grub.previous.cfg
    }
fi
