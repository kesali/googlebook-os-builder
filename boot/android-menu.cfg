# The laptop's menu for Googlebook OS. deploy.py fills in the placeholders: the kernel command line
# (android/cmdline.txt on one line) when it makes the bundle, and the kernel and initrd content
# hashes when it installs the files. The arguments after the command line are only for the laptop;
# QEMU's direct-kernel boot does not use this menu.
#   panic=0                       stay on screen after a kernel panic; Google's kernel reboots at once
#   printk.devkmsg=on             keep init's messages in the log, unthrottled
#   console=drm_log               enable the screen log despite Google's built-in console=ttynull
#   initcall_blacklist=nvme_init  never probe the internal NVMe: it holds another system
#   mt7921_common.disable_clc=1   MT7922 Wi-Fi: the CLC (regulatory power table) download panicked
#                                 this laptop under Churro; regulatory.db still applies. Android's
#                                 modprobe passes module.option= arguments to the module.
#   initcall_blacklist=sysfb_init test without the firmware framebuffer (second entry only)
#   earlycon=efifb                debug entry only: log on the firmware's framebuffer before the
#                                 kernel's own screen log starts. Every line is drawn and scrolled
#                                 synchronously, about 90 ms each here: 60 s of a 104 s boot.
set timeout=3
set default=0

# Only this laptop's Barcelo GPU selects the AMD stack; QEMU keeps softpipe.
set dali_graphics=softpipe
setpci -d 1002:15e7 -v dali_gpu VENDOR_ID
if [ "$dali_gpu" = "1002" ]; then
    set dali_graphics=amd
fi

# All entries keep the same boot files and NVMe safeguard; the test and debug entries add one argument.
function boot_android {
    linux ($root)/dali/kernel-@KERNEL@ @CMDLINE@ panic=0 printk.devkmsg=on console=drm_log initcall_blacklist=nvme_init mt7921_common.disable_clc=1 androidboot.dali.graphics=$dali_graphics $1
    initrd ($root)/dali/initramfs-@INITRAMFS@
}
menuentry "Googlebook OS" {
    boot_android
}
menuentry "Googlebook OS (test: Berberis ARM translation)" {
    boot_android androidboot.dali.native_bridge=libndk_translation.so
}
if [ "$dali_graphics" = amd ]; then
    menuentry "Googlebook OS (test: Vulkan HWUI)" {
        set dali_graphics=amd-vulkan
        boot_android
    }
fi
menuentry "Googlebook OS (test: no firmware framebuffer)" {
    boot_android initcall_blacklist=sysfb_init
}
menuentry "Googlebook OS (debug: slow early screen log, for black screens)" {
    boot_android earlycon=efifb
}
if [ -f ($root)/dali/grub.previous.cfg ]; then
    # Saved menus retain their old kernel arguments, which may enable EFI crash logging.
    menuentry "Previous build (may write UEFI crash records)" {
        configfile ($root)/dali/grub.previous.cfg
    }
fi
