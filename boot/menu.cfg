serial --unit=0 --speed=115200
terminal_output console serial
set timeout=3
set default=0
probe --set=boot_uuid --fs-uuid ($root)

menuentry "gbos-builder - diagnostic shell (not Android)" {
    linux ($root)/gbos-builder/kernel-@KERNEL@ rdinit=/init console=ttyS0,115200 console=tty0 loglevel=7 panic=0 gbos_builder.boot_uuid=$boot_uuid gbos_builder.test=0
    initrd ($root)/gbos-builder/initramfs-@INITRAMFS@
}
if [ -f ($root)/gbos-builder/grub.previous.cfg ]; then
    menuentry "Previous diagnostic build" {
        configfile ($root)/gbos-builder/grub.previous.cfg
    }
fi
