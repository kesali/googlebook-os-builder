serial --unit=0 --speed=115200
terminal_output console serial
set timeout=3
set default=0
probe --set=boot_uuid --fs-uuid ($root)

menuentry "Dali - diagnostic shell (not Android)" {
    linux ($root)/dali/kernel-@KERNEL@ rdinit=/init console=ttyS0,115200 console=tty0 loglevel=7 panic=0 dali.boot_uuid=$boot_uuid dali.test=0
    initrd ($root)/dali/initramfs-@INITRAMFS@
}
if [ -f ($root)/dali/grub.previous.cfg ]; then
    menuentry "Previous diagnostic build" {
        configfile ($root)/dali/grub.previous.cfg
    }
fi
