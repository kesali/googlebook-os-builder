# Stay on the device the firmware booted. Never search other disks by label.
regexp --set=1:root '^\(([^)]+)\)' "$cmdpath"
if [ -z "$root" ]; then
    echo "Cannot identify this USB's boot partition."
    halt
fi
if [ -f ($root)/dali/grub.cfg ]; then
    configfile ($root)/dali/grub.cfg
else
    configfile ($root)/dali/grub.previous.cfg
fi
